<?xml version="1.0" encoding="UTF-8"?>
<!--
  GitHub mark set as a seal: the official silhouette, untouched, inset in a
  carved keyline roundel. Same ring-plus-solid-core construction as the codex
  colour-mode icons (src/theme/Icon/LightMode), so the four navbar glyphs read
  as one set. The mark itself is left alone on purpose - it is the only thing
  on the bar whose whole job is brand recognition.

  Consumed as a CSS mask (src/css/custom.css, .navbar-github-link::before), so
  only the alpha matters; the fill is #000 rather than currentColor because
  currentColor does not resolve in a masked/backgrounded image.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
  <circle cx="12" cy="12" r="10.6" fill="none" stroke="#000" stroke-width="1.3"/>
  <g transform="translate(4.44 4.44) scale(0.63)">
    <path fill="#000" d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.69-3.88-1.54-3.88-1.54-.53-1.36-1.3-1.72-1.3-1.72-1.06-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.38.97.11-.76.41-1.27.74-1.56-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.06 0 0 .98-.31 3.2 1.18a11.1 11.1 0 0 1 2.92-.39c.99 0 1.99.13 2.92.39 2.22-1.49 3.2-1.18 3.2-1.18.63 1.59.23 2.77.11 3.06.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.4-5.27 5.68.42.36.79 1.06.79 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/>
  </g>
</svg>
